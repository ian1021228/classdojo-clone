<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crew 家長端 - 蜂巢成長聯絡簿</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dojo-ui.css">
  <link rel="icon" href="assets/svg/bee-twemoji.svg">
</head>
<body>

  <!-- Top Navbar -->
  <header class="dojo-navbar">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="index.html" class="dojo-brand">
        <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #fef3c7; border-radius: 12px; border: 1.5px solid #fde68a;">
          <img src="assets/svg/bee-twemoji.svg" alt="Crew Bee" style="width: 26px; height: 26px;">
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-weight: 900; font-size: 1.35rem; color: #1e293b;">Crew</span>
          <span style="font-size: 0.8rem; font-weight: 700; color: #b45309;">家長端</span>
        </div>
      </a>
      <select id="parent-child-select" style="padding: 6px 14px; border-radius: var(--radius-full); border: 1.5px solid var(--border-light); font-weight: 700; background: #ffffff; color: var(--text-main); font-size: 0.9rem; cursor: pointer; outline: none;">
      </select>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="nav-sound-toggle" class="btn btn-secondary btn-sm" title="開關全域音效" style="padding: 6px 10px;">
        <i class="fa-solid fa-volume-high" id="sound-toggle-icon"></i>
      </button>

      <div class="dojo-nav-links">
        <a href="teacher.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-chalkboard-user"></i> 切換教師端</a>
        <a href="student.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-wand-magic-sparkles"></i> 切換學生端</a>
        <a href="index.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-house"></i> 首頁</a>
      </div>
    </div>
  </header>

  <!-- Secondary Tab Navigation Bar -->
  <div class="dojo-tabs-bar">
    <div class="tabs-container">
      <button class="tab-btn active" id="tab-parent-report"><i class="fa-solid fa-chart-pie"></i> 小蜜蜂成長日誌</button>
      <button class="tab-btn" id="tab-parent-chat"><i class="fa-solid fa-comments"></i> 與蜜糖導師私訊</button>
      <button class="tab-btn" id="tab-parent-story"><i class="fa-solid fa-camera"></i> 蜂巢日誌牆</button>
    </div>
    <div>
      <button id="btn-print-parent-report" class="btn btn-secondary btn-sm"><i class="fa-solid fa-print"></i> 列印每週成長日誌</button>
    </div>
  </div>

  <!-- Main Container -->
  <main style="max-width: 1050px; margin: 24px auto 100px; padding: 0 20px; width: 100%;">
    <!-- ========================================== -->
    <!-- Tab 1: Child Progress Report               -->
    <!-- ========================================== -->
    <section id="view-parent-report">
      <!-- Child Summary Card -->
      <div style="background: #ffffff; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-sm); border: 1.5px solid #fde68a; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 24px;">
        <div style="display: flex; align-items: center; gap: 24px;">
          <div id="parent-child-monster-wrap" style="width: 120px; height: 110px; display: flex; align-items: center; justify-content: center; background: #fffdf5; border-radius: 20px; border: 1.5px solid #fde68a; padding: 10px;"></div>
          <div>
            <h2 id="parent-child-name" style="font-size: 1.8rem; font-weight: 800; color: #1e293b;">Beyoncé</h2>
            <p id="parent-child-class-info" style="color: #64748b; font-size: 0.95rem; margin-top: 4px;">向日葵四年一班 (Crew Sunflowers) • 導師：蜜糖導師</p>
            <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;">
              <span id="parent-att-badge" style="background: #dcfce7; color: #166534; font-weight: 700; font-size: 0.85rem; padding: 4px 12px; border-radius: var(--radius-full); border: 1px solid #bbf7d0;">
                <i class="fa-solid fa-check"></i> 今日出席正常
              </span>
              <span style="background: #fef3c7; color: #b45309; font-weight: 700; font-size: 0.85rem; padding: 4px 12px; border-radius: var(--radius-full); border: 1px solid #fde68a;">
                <i class="fa-solid fa-sun"></i> 本週正向採蜜率 100%
              </span>
              <span id="parent-level-badge" style="background: #fffdf5; color: #b45309; font-weight: 700; font-size: 0.85rem; padding: 4px 12px; border-radius: var(--radius-full); border: 1.5px solid #fde68a;">
                🥉 採蜜見習小蜂
              </span>
            </div>
          </div>
        </div>

        <div style="text-align: center; background: #fffdf5; border-radius: 16px; padding: 20px 32px; border: 1.5px solid #fde68a;">
          <span style="font-size: 0.85rem; font-weight: 700; color: #64748b; display: block; margin-bottom: 4px;">累積採蜜點數</span>
          <strong id="parent-child-points-total" style="font-size: 3rem; font-weight: 900; color: #d97706; line-height: 1;">5</strong>
          <small style="color: #b45309; display: block; margin-top: 4px; font-weight: 700;">🍯 滴純甜花蜜</small>
        </div>
      </div>

      <!-- Feedback History Detail Timeline -->
      <div style="background: #ffffff; border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-sm); border: 1.5px solid #fde68a;">
        <h3 style="font-size: 1.25rem; font-weight: 800; color: #1e293b; margin-bottom: 20px;"><i class="fa-solid fa-clock-rotate-left" style="color: #f59e0b;"></i> 教師課堂反饋與成長足跡</h3>
        <div id="parent-feedback-timeline" style="display: flex; flex-direction: column; gap: 14px;">
          <!-- Injected dynamically -->
        </div>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- Tab 2: Direct Chat with Teacher            -->
    <!-- ========================================== -->
    <section id="view-parent-chat" style="display: none;">
      <div class="chat-container" style="max-width: 840px; height: 580px; border: 1.5px solid #fde68a; border-radius: 16px; overflow: hidden; margin: 0 auto;">
        <div class="chat-main" style="width: 100%; display: flex; flex-direction: column; height: 100%;">
          <div class="chat-header" style="background: #fffdf5; border-bottom: 1.5px solid #fde68a; padding: 14px 20px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 42px; height: 42px; background: #fef3c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid #fde68a; font-size: 1.3rem;">🍯</div>
              <div>
                <strong style="font-size: 1.05rem; color: #1e293b;">蜜糖導師 (Teacher Honey)</strong>
                <div style="font-size: 0.8rem; color: #10b981; font-weight: 700;">🟢 目前在線上 (青青草地實驗小學)</div>
              </div>
            </div>
          </div>

          <div class="chat-messages-area" id="parent-chat-messages-box" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #faf9f6;">
            <!-- Injected dynamically -->
          </div>

          <div class="chat-input-bar" style="padding: 14px 20px; background: #ffffff; border-top: 1px solid #fde68a; display: flex; gap: 10px;">
            <input type="text" id="parent-chat-input" placeholder="輸入傳送給蜜糖導師的悄悄話..." style="flex: 1; padding: 10px 16px; border: 1.5px solid #e2e8f0; border-radius: var(--radius-full); outline: none; font-size: 0.95rem;">
            <button class="btn btn-primary btn-sm" id="btn-parent-send" style="padding: 10px 20px; border-radius: var(--radius-full);"><i class="fa-solid fa-paper-plane"></i> 發送</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- Tab 3: Class Story Feed                   -->
    <!-- ========================================== -->
    <section id="view-parent-story" style="display: none;">
      <div class="story-feed-wrap" style="max-width: 720px; margin: 0 auto;">
        <div id="parent-story-posts" style="display: flex; flex-direction: column; gap: 20px;">
          <!-- Injected dynamically -->
        </div>
      </div>
    </section>
  </main>

  <!-- Mobile Bottom Navigation Bar (393x852) -->
  <nav class="mobile-bottom-bar">
    <button class="mobile-nav-item active" id="mob-par-report">
      <span class="mobile-nav-icon"><i class="fa-solid fa-chart-pie"></i></span>
      <span>成長日誌</span>
    </button>
    <button class="mobile-nav-item" id="mob-par-chat">
      <span class="mobile-nav-icon"><i class="fa-solid fa-comments"></i></span>
      <span>導師私訊</span>
    </button>
    <button class="mobile-nav-item" id="mob-par-story">
      <span class="mobile-nav-icon"><i class="fa-solid fa-camera"></i></span>
      <span>蜂巢動態</span>
    </button>
  </nav>

  <!-- Modal: Honey Certificate of Merit (榮譽學習證書) -->
  <div class="modal-backdrop" id="certificate-modal">
    <div class="modal-card" style="max-width: 760px; background: transparent; box-shadow: none; border: none;">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 12px; gap: 10px;">
        <button class="btn btn-primary" id="btn-modal-print-cert"><i class="fa-solid fa-print"></i> 列印此證書</button>
        <button class="btn btn-secondary" id="btn-close-cert"><i class="fa-solid fa-xmark"></i> 關閉</button>
      </div>

      <div class="certificate-frame" id="certificate-content">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/monster-engine.js"></script>
  <script type="module" src="js/parent.js"></script>
</body>
</html>
